services:
  - type: web
    name: devpilot-api
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DEMO_MODE
        value: "true"
      - key: LLM_PROVIDER
        value: demo
      - key: DATABASE_PATH
        value: /tmp/devpilot.db
      - key: STORAGE_DIR
        value: /tmp/devpilot-storage
      - key: FRONTEND_URL
        sync: false
